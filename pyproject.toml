[project]
name = "apex-ai-gaming"
version = "0.1.0"
description = "Autonomous gaming research and creator operations foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100